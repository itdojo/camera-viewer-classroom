# Device Kit — test-pattern Device
#
# A camera-less Device for development, CI and classroom demos. From this
# directory:
#
#   ../gen-cert.sh          # once: certificate in ./certs, credentials in ./.env
#   docker compose up -d    # start the Device
#
# gen-cert.sh prints the certificate fingerprint and the instance user's
# credentials. Enter them in Camera Viewer when you add this Device.
#
# Ports: 8322/tcp RTSPS (the Camera), 9997/tcp the MediaMTX API over HTTPS.
# Nothing else is exposed: plain RTSP, RTMP, HLS and WebRTC are switched off.

# GPS: `docker compose --profile gps up -d` also starts the GPS Sidecar
# (../gps/compose.yaml), which serves a GNSS receiver's fixes on 9998/tcp.
# Without the profile it stays off.
include:
  - path: ../gps/compose.yaml
    project_directory: .

services:
  mediamtx:
    # Pinned to exactly 1.21.2, the same MediaMTX as the Camera Viewer image.
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_1_USER: ${INSTANCE_USER:?run ../gen-cert.sh first, or set INSTANCE_USER in .env}
      MTX_AUTHINTERNALUSERS_1_PASS: ${INSTANCE_PASS:?run ../gen-cert.sh first, or set INSTANCE_PASS in .env}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ${DEVICE_CERTS_DIR:-./certs}:/certs:ro
    ports:
      # Keep 8322 published as 8322: the instance always pulls a Camera from
      # 8322 on the Device's address. API_PORT may move if 9997 is taken (add
      # the Device as host:port). Both take 127.0.0.1:0, an ephemeral loopback
      # port, which only the tests use.
      - "${RTSPS_PORT:-8322}:8322"
      - "${API_PORT:-9997}:9997"
