# Device Kit — USB webcam Device (MediaMTX 1.21.2)
#
# Publishes one Camera, `usb`, from the webcam compose.yaml maps in at
# /dev/camera-usb. MediaMTX has no native V4L2 capture, so ffmpeg captures
# it and publishes back over loopback. Hardened like every kit Device:
#   - authentication on; only the instance user may read or use the API
#   - RTSPS only (`rtspEncryption: strict`), TCP transport
#   - the API served over HTTPS with the kit-generated self-signed certificate
#   - every other server (RTMP, HLS, WebRTC, SRT, MoQ, playback) switched off
#
# The instance user's name and password are not in this file. compose.yaml
# injects them from `.env` as MTX_AUTHINTERNALUSERS_1_USER / _PASS, which
# override the placeholders on the second user below.

logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  # The ffmpeg capture inside this container publishes over loopback.
  # Nothing outside the container can use this entry.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: usb
      - action: publish
        path: usb-2

  # The instance user: the Camera Viewer instance pulls Cameras and discovers
  # them through the API. Overridden from the environment; see header.
  - user: instance-user-from-env
    pass: instance-pass-from-env
    ips: []
    permissions:
      - action: read
      - action: api

api: true
apiAddress: :9997
apiEncryption: true
apiServerKey: /certs/server.key
apiServerCert: /certs/server.crt

metrics: false
pprof: false
playback: false

rtsp: true
rtspTransports: [tcp]
rtspEncryption: strict
rtspsAddress: :8322
rtspServerKey: /certs/server.key
rtspServerCert: /certs/server.crt
rtspAuthMethods: [basic]

rtmp: false
hls: false
webrtc: false
srt: false
moq: false

paths:
  usb:
    # Capture MJPG: the webcams this targets (Logitech C9xx) offer only YUYV
    # and MJPG, and raw YUYV at 720p is limited to a few fps by USB 2.0.
    # ultrafast + zerolatency (and -bf 0, to be explicit) emit no B-frames,
    # which WebRTC playback requires. ffmpeg does not verify the loopback
    # certificate (tls_verify defaults to off), which is what we want here.
    # It boots at Quality Medium (720p, 15 fps, 1 Mbit/s, a keyframe every
    # 15 frames), so a Device that reboots onto a slow LTE uplink doesn't
    # start at 2 Mbit/s. The instance sets the Quality through the API by
    # rewriting only -video_size, -framerate, -g, -b:v, -maxrate and
    # -bufsize in this command, and puts it back after a restart (ADR 0009);
    # the webcam must offer each size and rate in MJPG
    # (`v4l2-ctl --list-formats-ext`).
    # MediaMTX fills in $USB_CAMERA_FILTER from the container's environment;
    # compose.yaml sets it from .env (flip), or `null` (no change).
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning
      -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 15
      -i /dev/camera-usb
      -vf $USB_CAMERA_FILTER
      -c:v libx264 -preset ultrafast -tune zerolatency -bf 0
      -pix_fmt yuv420p -g 15 -b:v 1M -maxrate 1M -bufsize 500k
      -f rtsp -rtsp_transport tcp rtsps://127.0.0.1:8322/usb
    runOnInitRestart: true

  # A second webcam; see compose.yaml.
  # usb-2:
  #   runOnInit: >-
