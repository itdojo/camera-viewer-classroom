# Camera Viewer — the Relay (MediaMTX 1.21.2)
#
# The instance's own MediaMTX (ADR 0001). It pulls every Camera from its
# Device and is the only thing browsers receive video from. The backend owns
# every path: this file declares none, and the Relay Controller re-applies the
# whole path set through the API whenever the Relay (re)starts, because API
# changes live in memory only. That includes recording: each path's record
# settings and segment hooks come from the backend's Recorder.
#
# Listening, deliberately:
#   - API on 127.0.0.1 only; nothing but the backend may configure the Relay
#   - WebRTC signalling (WHEP) on 127.0.0.1 only; browsers reach it solely
#     through the backend's session-gated Playback Gateway
#   - WebRTC media on UDP 8189 on every interface (override with
#     MTX_WEBRTCLOCALUDPADDRESS), since browsers must reach it directly
#   - RTSP on 127.0.0.1 only, TCP only: the Relay reads its own paths through
#     it to hold a recorded Feed open when no browser watches it
#   - no RTMP, HLS, SRT, MoQ, playback or metrics server at all
#
# The ports avoid MediaMTX's defaults (9997, 8889, 8554) so the Relay never
# collides with a Device Kit Device running on the same host under Linux
# host networking.

logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  # The backend and the Relay itself (hold paths), on loopback, are the
  # Relay's only clients besides WebRTC media. Loopback alone is not enough:
  # under Linux host networking it is the whole host's, shared with every
  # local user and host-networked container. So the one user is generated by
  # the supervisor at every start and passed in as
  # MTX_AUTHINTERNALUSERS_0_USER / _PASS. The placeholder below is the hash
  # of random bytes nobody kept: if the override were ever missing, nothing
  # could log in, rather than anything.
  - user: camera-viewer
    pass: "sha256:cFi9o5k8OeQqDIWI7ni094uZLYmQk6HzTYOqKiSR7xs="
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: read

api: true
apiAddress: 127.0.0.1:19997

webrtc: true
webrtcAddress: 127.0.0.1:18889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: []

rtsp: true
rtspAddress: 127.0.0.1:18554
rtspTransports: [tcp]
rtspEncryption: "no"

metrics: false
pprof: false
playback: false
rtmp: false
hls: false
srt: false
moq: false

paths: {}
